# Kamal 2: two instances of Leak from one image, usually on one VPS.
#
#   bin/kamal setup  -d demo      # first time: Postgres, proxy, app
#   bin/kamal deploy -d private   # afterwards
#
# demo     public, synthetic data only, uploads off   (config/deploy.demo.yml)
# private  the household's own statements             (config/deploy.private.yml)
#
# Settings come from the environment, so nothing about the server is in git:
#   LEAK_SERVER        the VPS's IP address or hostname (SSH as root, or set LEAK_SSH_USER)
#   LEAK_DEMO_HOST     the public demo's domain, e.g. demo.example.com
#   LEAK_PRIVATE_HOST  the private instance's domain
#   KAMAL_REGISTRY_USERNAME / KAMAL_REGISTRY_PASSWORD  ghcr.io user and a token with write:packages
# Secrets: .kamal/secrets-common and .kamal/secrets.<destination>. README › Deploying.

# Each destination overrides this, so their containers, Postgres and
# volumes don't collide on a shared server.
service: leak

image: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "sehaan-1").downcase %>/leak

require_destination: true

servers:
  web:
    - <%= ENV.fetch("LEAK_SERVER", "set-LEAK_SERVER") %>

ssh:
  user: <%= ENV.fetch("LEAK_SSH_USER", "root") %>

# kamal-proxy terminates TLS with Let's Encrypt; each destination sets its host.
proxy:
  ssl: true
  # Statement upload parses the PDF in the request.
  response_timeout: 60
  healthcheck:
    path: /up

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "sehaan-1") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - SECRET_KEY_BASE
    - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
    - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
    - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
    - LEAK_DATABASE_PASSWORD
  clear:
    # Background jobs (detection after an import, the LLM step, demo clean-up)
    # run in the web container's Puma.
    SOLID_QUEUE_IN_PUMA: true
    RAILS_LOG_LEVEL: info

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
  # bin/kamal rails -d private "'leak:users:create[mum@example.com,Sharma household]'"
  rails: app exec --reuse "bin/rails"

# No volumes: statement PDFs are parsed in the request and never stored, so
# everything Leak keeps is in Postgres.

asset_path: /rails/public/spa

builder:
  arch: amd64

accessories:
  db:
    image: postgres:18
    host: <%= ENV.fetch("LEAK_SERVER", "set-LEAK_SERVER") %>
    # Not published: the app reaches it as <service>-db on Kamal's Docker network.
    env:
      clear:
        POSTGRES_USER: leak
        POSTGRES_DB: leak_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker.
      - data:/var/lib/postgresql
