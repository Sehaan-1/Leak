# The global merchant catalogue: how each merchant shows up on Indian bank
# statements. Synced into merchants/merchant_aliases by
# `bin/rails leak:merchants:sync` (also run by db:seed and the eval).
#
#   names: payee names as printed. Normalised to A-Z0-9 ("Netflix.com" =>
#          NETFLIXCOM). Names of 5+ characters also match as a prefix of a
#          longer payee ("NETFLIX" matches "NETFLIX ENTERTAINMENT SERVICES").
#   vpas:  exact UPI IDs.
#
# Categories feed detection later: investment, loan, insurance, rent and
# utilities are recurring by nature and must not be flagged as leaks.

netflix:
  name: Netflix
  category: streaming
  names: [NETFLIX, NETFLIX COM, NETFLIX ENTERTAINMENT SERVICES]
  vpas: [netflixupi.payu@hdfcbank, netflix@icici]
