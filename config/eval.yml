# Eval gates. CI runs `bin/rails leak:eval:merchants` on the frozen golden
# set and fails if a gate is missed. See eval/merchant_resolution/README.md.
merchant_resolution:
  golden: eval/merchant_resolution/golden-v1.jsonl
  # The golden set is frozen: editing it changes this hash and fails CI.
  # Make a golden-v2 instead, and record why in the README.
  golden_sha256: 0a647cf0cafa693f49ef35a667bf2a277aec64ca7d885f84893cffc7b04e88c9
  dev: eval/merchant_resolution/dev.jsonl
  # Rules-only baseline on golden-v1 (2026-11-20): merchant accuracy 99.4%
  # [96.8%, 99.9%] at coverage 76.3% [70.4%, 81.4%], 224 business rows.
  # The gate sits just below it: about three more wrong answers, or three
  # fewer answered rows, fails CI.
  gate:
    # 95% Wilson lower bound on merchant accuracy among answered business rows.
    merchant_accuracy_low: 0.95
    # Share of business rows the resolver answers instead of abstaining.
    merchant_coverage: 0.75
  # Rules + LLM (docs/design/llm-merchant-resolution.md) on the same set
  # must beat rules only.
  # CI checks it with recorded replies (LLM_EVAL=replay); the LLM eval
  # workflow checks it live when the prompt, model or catalogue changes,
  # and nightly.
  llm_gate:
    # The same accuracy floor as the rules-only gate.
    merchant_accuracy_low: 0.95
    # Net score = correct answers - cost × wrong answers (abstaining scores
    # 0). Rules + LLM must score higher than rules only over all rows, and
    # no lower over business rows: one wrong merchant costs three right ones.
    wrong_answer_cost: 3

# Recurring-charge detection (docs/design/recurring-charge-detection.md). CI runs
# `bin/rails leak:eval:detection` on the frozen golden set and fails if a
# gate is missed. See eval/detection/README.md.
detection:
  golden: eval/detection/golden-v1.jsonl
  # Frozen like the merchant set: make a golden-v2 instead of editing it.
  golden_sha256: 2df025067837b7fdd2590d72f2ed221dd2a3b5ec656a66c48753eac371e6c9ae
  dev: eval/detection/dev.jsonl
  # Baseline on golden-v1 (2026-11-21), 100 households, 49,665 debits:
  #   false flags 0.06 [0.04, 0.08] per 100 charges (29, all ordinary purchases)
  #   series precision 97.9% [95.8%, 99.0%], recall 95.7% [93.0%, 97.4%] (346 detectable)
  #   price increases precision 100% (47/47), recall 92.2% (47/51)
  #   duplicate subscriptions precision 100% (22/22), recall 100% (22/22)
  #   status (active/ended) 99.1%
  # The gates sit a little below it. Flagging any commitment (SIP, EMI,
  # rent, insurance, utilities, card bill) always fails.
  gate:
    # Upper 95% Wilson bound, per 100 debits.
    false_flags_per_100_high: 0.15
    # Lower 95% Wilson bound.
    series_precision_low: 0.93
    series_recall: 0.92
    price_increase_precision: 0.95
    price_increase_recall: 0.85
    duplicate_precision: 0.9
    duplicate_recall: 0.85
    status_accuracy: 0.97
