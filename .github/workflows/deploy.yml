name: Deploy

# Deploys one instance with Kamal (config/deploy.yml), on demand:
#   gh workflow run deploy.yml -f destination=demo
#   gh workflow run deploy.yml -f destination=private -f setup=true   # first time
#
# Needs, as repository secrets (README › Deploying):
#   SSH_PRIVATE_KEY      a key the VPS accepts (for LEAK_SSH_USER, default root)
#   LEAK_SERVER          the VPS's IP address or hostname
#   LEAK_DEMO_HOST / LEAK_PRIVATE_HOST   the instances' domains
#   LEAK_<DESTINATION>_*  from `bin/rails 'leak:secrets[<destination>]'`
# The image goes to this repository's ghcr.io package with the job's token.

on:
  workflow_dispatch:
    inputs:
      destination:
        description: Which instance
        type: choice
        options: [demo, private]
        required: true
      setup:
        description: First deploy to this server (kamal setup)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.destination }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      DESTINATION: ${{ inputs.destination }}
      KAMAL_REGISTRY_USERNAME: ${{ github.repository_owner }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      LEAK_SERVER: ${{ secrets.LEAK_SERVER }}
      LEAK_SSH_USER: ${{ secrets.LEAK_SSH_USER || 'root' }}
      LEAK_DEMO_HOST: ${{ secrets.LEAK_DEMO_HOST }}
      LEAK_PRIVATE_HOST: ${{ secrets.LEAK_PRIVATE_HOST }}
      LEAK_DEMO_SECRET_KEY_BASE: ${{ secrets.LEAK_DEMO_SECRET_KEY_BASE }}
      LEAK_DEMO_ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${{ secrets.LEAK_DEMO_ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY }}
      LEAK_DEMO_ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.LEAK_DEMO_ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY }}
      LEAK_DEMO_ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.LEAK_DEMO_ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT }}
      LEAK_DEMO_POSTGRES_PASSWORD: ${{ secrets.LEAK_DEMO_POSTGRES_PASSWORD }}
      LEAK_PRIVATE_SECRET_KEY_BASE: ${{ secrets.LEAK_PRIVATE_SECRET_KEY_BASE }}
      LEAK_PRIVATE_ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${{ secrets.LEAK_PRIVATE_ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY }}
      LEAK_PRIVATE_ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.LEAK_PRIVATE_ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY }}
      LEAK_PRIVATE_ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.LEAK_PRIVATE_ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT }}
      LEAK_PRIVATE_POSTGRES_PASSWORD: ${{ secrets.LEAK_PRIVATE_POSTGRES_PASSWORD }}
      LEAK_PRIVATE_LLM_PROVIDER: ${{ secrets.LEAK_PRIVATE_LLM_PROVIDER }}
      LEAK_PRIVATE_LLM_API_KEY: ${{ secrets.LEAK_PRIVATE_LLM_API_KEY }}
      LEAK_PRIVATE_LLM_MODEL: ${{ secrets.LEAK_PRIVATE_LLM_MODEL }}
      LEAK_PRIVATE_LLM_BASE_URL: ${{ secrets.LEAK_PRIVATE_LLM_BASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the settings are there
        env:
          SSH_KEY_SET: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        run: |
          prefix="LEAK_${DESTINATION^^}_"
          missing=()
          for name in LEAK_SERVER "${prefix%_}_HOST" "${prefix}SECRET_KEY_BASE" "${prefix}ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY" \
                      "${prefix}ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY" "${prefix}ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT" \
                      "${prefix}POSTGRES_PASSWORD"; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          [ "$SSH_KEY_SET" = "true" ] || missing+=(SSH_PRIVATE_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing repository secrets::${missing[*]} (README › Deploying)"
            exit 1
          fi

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the server's SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$LEAK_SERVER" >> ~/.ssh/known_hosts

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: docker/setup-buildx-action@v4

      - name: Kamal
        run: |
          if [ "${{ inputs.setup }}" = "true" ]; then
            bin/kamal setup -d "$DESTINATION"
          else
            bin/kamal deploy -d "$DESTINATION"
          fi
