name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: RuboCop
        run: bin/rubocop -f github

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Brakeman
        run: bin/brakeman --no-pager --exit-on-warn --exit-on-error
      - name: Gem audit
        run: bin/bundler-audit

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated API types match openapi.yaml
        run: npm run api-types:check
      - name: Biome
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Production build
        run: npm run build
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s
          --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      # pg_dump/psql must match the server major version for structure.sql.
      # poppler-utils provides pdftotext for statement import.
      - name: PostgreSQL 18 client and poppler
        run: |
          for i in 1 2 3; do sudo apt-get install -y -q postgresql-common && break || sleep 10; done
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          for i in 1 2 3; do sudo apt-get install -y -q postgresql-client-18 poppler-utils && break || sleep 10; done
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: structure.sql matches migrations
        env:
          RAILS_ENV: development
        run: |
          bin/rails db:create db:migrate
          git diff --exit-code db/structure.sql

      - name: RSpec
        env:
          RAILS_ENV: test
          REQUIRE_PDFTOTEXT: "1"
        # On failure, the tail of the output becomes an annotation too, so
        # errors outside examples (boot, load, db:test:prepare) show on the PR.
        run: |
          set -o pipefail
          { bin/rails db:test:prepare && bundle exec rspec --format progress; } 2>&1 | tee rspec.log || {
            echo "::error title=RSpec failed::$(tail -c 6000 rspec.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }

      # Rules-only merchant resolution on the frozen golden set; fails below
      # the gate in config/eval.yml. Scores go to the job summary.
      - name: Merchant resolution eval (golden gate)
        env:
          RAILS_ENV: test
        run: bin/rails 'leak:eval:merchants[golden]'

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-merchant-resolution
          path: tmp/eval/
          if-no-files-found: ignore
